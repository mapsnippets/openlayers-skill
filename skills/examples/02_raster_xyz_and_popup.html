<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenLayers - Raster Tiles & HTML Overlay Popup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.1.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@v10.1.0/dist/ol.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #map { height: 100vh; width: 100vw; }
    .ol-popup {
      position: absolute; background-color: white; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      padding: 14px 18px; border-radius: 10px; border: 1px solid #e2e8f0;
      bottom: 12px; left: -50px; min-width: 220px; font-size: 13px; color: #1e293b;
    }
    .ol-popup:after, .ol-popup:before {
      top: 100%; border: solid transparent; content: " "; height: 0; width: 0; position: absolute; pointer-events: none;
    }
    .ol-popup:after { border-top-color: white; border-width: 10px; left: 48px; margin-left: -10px; }
    .ol-popup-closer {
      text-decoration: none; position: absolute; top: 8px; right: 10px; color: #94a3b8; font-weight: bold; font-size: 16px;
    }
    .ol-popup-closer:hover { color: #0f172a; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer">&times;</a>
    <div id="popup-content"></div>
  </div>

  <script>
    // Get free API key at: https://docs.maptiler.com/cloud/api/authentication-key/
    const API_KEY = "YOUR_API_KEY";
    const pragueCoord = ol.proj.fromLonLat([14.4005, 50.0901]);

    const rasterLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: `https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=${API_KEY}`,
        tileSize: 512,
        maxZoom: 22,
        attributions: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OSM</a>'
      })
    });

    const container = document.getElementById('popup');
    const content = document.getElementById('popup-content');
    const closer = document.getElementById('popup-closer');

    const overlay = new ol.Overlay({
      element: container,
      autoPan: { animation: { duration: 250 } }
    });

    const map = new ol.Map({
      target: 'map',
      layers: [rasterLayer],
      overlays: [overlay],
      view: new ol.View({
        center: pragueCoord,
        zoom: 14
      })
    });

    // Show initial pin at Prague Castle
    content.innerHTML = '<b>🏰 Prague Castle</b><br><small>Hradčany, Prague, Czech Republic</small>';
    overlay.setPosition(pragueCoord);

    closer.onclick = function() {
      overlay.setPosition(undefined);
      closer.blur();
      return false;
    };

    map.on('singleclick', function(evt) {
      const coordinate = evt.coordinate;
      const lonLat = ol.proj.toLonLat(coordinate);
      content.innerHTML = `<b>Coordinates:</b><br>Lat: ${lonLat[1].toFixed(5)}, Lng: ${lonLat[0].toFixed(5)}`;
      overlay.setPosition(coordinate);
    });
  </script>
</body>
</html>

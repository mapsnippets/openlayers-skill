<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenLayers - Split-Screen Layer Swipe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.1.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@v10.1.0/dist/ol.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; position: absolute; }
    #swipe {
      position: absolute; top: 50%; left: 0; width: 100%; z-index: 1000;
      transform: translateY(-50%); pointer-events: auto; margin: 0;
      -webkit-appearance: none; appearance: none; background: transparent;
    }
    #swipe::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 4px; height: 100vh; background: #0084ff; cursor: ew-resize;
      box-shadow: 0 0 10px rgba(0,132,255,0.8);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <input id="swipe" type="range" min="0" max="100" value="50">

  <script>
    // Get free API key at: https://docs.maptiler.com/cloud/api/authentication-key/
    const API_KEY = "YOUR_API_KEY";

    const streetLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: `https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=${API_KEY}`,
        tileSize: 512
      })
    });

    const aerialLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: `https://api.maptiler.com/maps/satellite-v4/{z}/{x}/{y}.jpg?key=${API_KEY}`,
        tileSize: 512
      })
    });

    const map = new ol.Map({
      target: "map",
      layers: [streetLayer, aerialLayer],
      view: new ol.View({
        center: ol.proj.fromLonLat([14.4378, 50.0755]),
        zoom: 14
      })
    });

    const swipe = document.getElementById("swipe");

    aerialLayer.on("prerender", function (event) {
      const ctx = event.context;
      const mapSize = map.getSize();
      const width = mapSize[0] * (parseFloat(swipe.value) / 100);

      const tl = ol.render.getRenderPixel(event, [width, 0]);
      const tr = ol.render.getRenderPixel(event, [mapSize[0], 0]);
      const bl = ol.render.getRenderPixel(event, [width, mapSize[1]]);
      const br = ol.render.getRenderPixel(event, mapSize);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(tl[0], tl[1]);
      ctx.lineTo(tr[0], tr[1]);
      ctx.lineTo(br[0], br[1]);
      ctx.lineTo(bl[0], bl[1]);
      ctx.closePath();
      ctx.clip();
    });

    aerialLayer.on("postrender", function (event) {
      event.context.restore();
    });

    swipe.addEventListener("input", function () {
      map.render();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenLayers - GeoJSON Choropleth & Hover Highlights</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.1.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@v10.1.0/dist/ol.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #map { height: 100vh; width: 100vw; }
    .info-box {
      position: absolute; top: 16px; right: 16px; z-index: 1000;
      background: white; padding: 12px 18px; border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15); font-size: 13px; color: #1e293b;
      min-width: 180px; border: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <div id="info" class="info-box"><b>Hover over a zone</b></div>
  <div id="map"></div>

  <script>
    // Get free API key at: https://docs.maptiler.com/cloud/api/authentication-key/
    const API_KEY = "YOUR_API_KEY";

    const baseLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: `https://api.maptiler.com/maps/dataviz-v4-light/{z}/{x}/{y}.png?key=${API_KEY}`,
        tileSize: 512
      })
    });

    const sampleGeoJSON = {
      type: "FeatureCollection",
      features: [
        {
          type: "Feature",
          properties: { name: "Zone Alpha (Express)", fee: 0, density: "High" },
          geometry: {
            type: "Polygon",
            coordinates: [[[14.41, 50.07], [14.44, 50.07], [14.44, 50.09], [14.41, 50.09], [14.41, 50.07]]]
          }
        },
        {
          type: "Feature",
          properties: { name: "Zone Beta (Standard)", fee: 5, density: "Medium" },
          geometry: {
            type: "Polygon",
            coordinates: [[[14.44, 50.07], [14.47, 50.07], [14.47, 50.09], [14.44, 50.09], [14.44, 50.07]]]
          }
        },
        {
          type: "Feature",
          properties: { name: "Zone Gamma (Extended)", fee: 12, density: "Low" },
          geometry: {
            type: "Polygon",
            coordinates: [[[14.41, 50.05], [14.47, 50.05], [14.47, 50.07], [14.41, 50.07], [14.41, 50.05]]]
          }
        }
      ]
    };

    const vectorSource = new ol.source.Vector({
      features: new ol.format.GeoJSON().readFeatures(sampleGeoJSON, {
        dataProjection: "EPSG:4326",
        featureProjection: "EPSG:3857"
      })
    });

    function getZoneStyle(feature) {
      const fee = feature.get("fee");
      const color = fee === 0 ? "rgba(46, 204, 113, 0.45)" : fee === 5 ? "rgba(241, 196, 15, 0.45)" : "rgba(231, 76, 60, 0.45)";
      const strokeColor = fee === 0 ? "#27ae60" : fee === 5 ? "#d35400" : "#c0392b";
      return new ol.style.Style({
        fill: new ol.style.Fill({ color: color }),
        stroke: new ol.style.Stroke({ color: strokeColor, width: 2 })
      });
    }

    const vectorLayer = new ol.layer.Vector({
      source: vectorSource,
      style: getZoneStyle
    });

    const map = new ol.Map({
      target: "map",
      layers: [baseLayer, vectorLayer],
      view: new ol.View({
        center: ol.proj.fromLonLat([14.44, 50.07]),
        zoom: 13
      })
    });

    // Hover Highlight
    let hovered = null;
    const highlightStyle = new ol.style.Style({
      fill: new ol.style.Fill({ color: "rgba(0, 132, 255, 0.55)" }),
      stroke: new ol.style.Stroke({ color: "#0084ff", width: 3.5 })
    });

    const infoBox = document.getElementById("info");

    map.on("pointermove", function (evt) {
      if (evt.dragging) return;
      const pixel = map.getEventPixel(evt.originalEvent);
      const feature = map.forEachFeatureAtPixel(pixel, (f) => f);

      if (hovered !== feature) {
        if (hovered) hovered.setStyle(undefined);
        if (feature) {
          feature.setStyle(highlightStyle);
          infoBox.innerHTML = `<b>${feature.get("name")}</b><br>Fee: $${feature.get("fee")} | Density: ${feature.get("density")}`;
        } else {
          infoBox.innerHTML = "<b>Hover over a zone</b>";
        }
        hovered = feature;
      }
    });
  </script>
</body>
</html>
